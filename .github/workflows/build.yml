name: XION PC CHECK EXE Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package BAT into EXE
        shell: pwsh
        run: |
          $bat = "$env:GITHUB_WORKSPACE\XION_PC_CHECK.bat"
          $sed = "$env:RUNNER_TEMP\build.sed"
          $exe = "$env:RUNNER_TEMP\XION_PC_CHECK.exe"
          $iexpress = "$env:WINDIR\System32\iexpress.exe"

          if (!(Test-Path $bat)) {
            throw "BAT file not found"
          }

          if (!(Test-Path $iexpress)) {
            throw "IExpress is not installed"
          }

          $content = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=1
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$exe
          FriendlyName=XION PC CHECK
          AppLaunched=cmd.exe /c XION_PC_CHECK.bat
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [SourceFiles]
          SourceFiles0=$env:GITHUB_WORKSPACE
          [SourceFiles0]
          %FILE0%=
          [Strings]
          FILE0="XION_PC_CHECK.bat"
          "@

          Set-Content $sed $content -Encoding ASCII

          & $iexpress /N /Q $sed

          Write-Host "Checking generated EXE..."
          Get-ChildItem $env:RUNNER_TEMP -Filter *.exe

          if (!(Test-Path $exe)) {
            throw "IExpress did not generate the EXE. Check the runner logs."
          }

          Copy-Item $exe "$env:GITHUB_WORKSPACE\XION_PC_CHECK.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XION-PC-CHECK-EXE
          path: XION_PC_CHECK.exe
