name: XION PC CHECK EXE Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Package BAT into EXE
        shell: pwsh
        run: |
          $bat = Join-Path $env:GITHUB_WORKSPACE "XION_PC_CHECK.bat"
          $exe = Join-Path $env:GITHUB_WORKSPACE "XION_PC_CHECK.exe"
          $sed = Join-Path $env:RUNNER_TEMP "build.sed"

          if (!(Test-Path $bat)) {
            throw "XION_PC_CHECK.bat not found"
          }

          $content = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=1
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$exe
          FriendlyName=XION PC CHECK
          AppLaunched=cmd.exe /c XION_PC_CHECK.bat
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [SourceFiles]
          SourceFiles0=$env:GITHUB_WORKSPACE
          [SourceFiles0]
          %FILE0%=
          [Strings]
          FILE0="XION_PC_CHECK.bat"
          "@

          Set-Content -Path $sed -Value $content -Encoding ASCII

          & "$env:WINDIR\System32\iexpress.exe" /N /Q $sed

          if (!(Test-Path $exe)) {
            throw "EXE build failed"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XION-PC-CHECK-EXE
          path: XION_PC_CHECK.exe
