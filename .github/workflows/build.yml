name: XION PC CHECK EXE Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile XION_PC_CHECK.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XION-PC-CHECK
          path: dist/XION_PC_CHECK.exe
