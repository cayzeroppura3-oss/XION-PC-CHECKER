name: XION PC CHECK EXE Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Build EXE
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\XIONBUILD"
          New-Item -ItemType Directory -Force $work | Out-Null

          $bat = "$env:GITHUB_WORKSPACE\XION_PC_CHECK.bat"

          if (!(Test-Path $bat)) {
            throw "BAT file missing"
          }

          Copy-Item $bat "$work\XION_PC_CHECK.bat"

          $exe = "$work\XION_PC_CHECK.exe"
          $sed = "$work\build.sed"

          $content = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=1
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=1
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$exe
          FriendlyName=XION PC CHECK
          AppLaunched=cmd.exe /c XION_PC_CHECK.bat
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [SourceFiles]
          SourceFiles0=$work
          [SourceFiles0]
          %FILE0%=
          [Strings]
          FILE0="XION_PC_CHECK.bat"
          "@

          Set-Content $sed $content -Encoding ASCII

          & "$env:WINDIR\System32\iexpress.exe" /N /Q /M $sed

          if (!(Test-Path $exe)) {
            Get-ChildItem $work -Recurse
            throw "EXE generation failed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: XION-PC-CHECK-EXE
          path: ${{ runner.temp }}/XIONBUILD/XION_PC_CHECK.exe
