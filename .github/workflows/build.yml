name: XION PC CHECK EXE Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check BAT file
        shell: pwsh
        run: |
          $bat = "$env:GITHUB_WORKSPACE\XION_PC_CHECK.bat"

          if (!(Test-Path $bat)) {
            throw "XION_PC_CHECK.bat not found"
          }

          Write-Host "BAT file found!"
          Get-Item $bat | Format-List Name, Length

      - name: Package BAT into EXE
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\XIONBUILD"
          $bat = "$env:GITHUB_WORKSPACE\XION_PC_CHECK.bat"
          $sed = "$work\build.sed"
          $exe = "$work\XION_PC_CHECK.exe"
          $iexpress = "$env:WINDIR\System32\iexpress.exe"

          New-Item -ItemType Directory -Force $work | Out-Null

          Copy-Item $bat "$work\XION_PC_CHECK.bat"

          if (!(Test-Path $iexpress)) {
            throw "IExpress not found"
          }

          $content = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=1
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=1
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$exe
          FriendlyName=XION PC CHECK
          AppLaunched=cmd.exe /c XION_PC_CHECK.bat
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [SourceFiles]
          SourceFiles0=$work
          [SourceFiles0]
          %FILE0%=
          [Strings]
          FILE0="XION_PC_CHECK.bat"
          "@

          Set-Content -Path $sed -Value $content -Encoding ASCII

          Write-Host "Starting IExpress..."

          $process = Start-Process `
            -FilePath $iexpress `
            -ArgumentList "/N", "/Q", "/M", "`"$sed`"" `
            -Wait `
            -PassThru

          Write-Host "IExpress exit code: $($process.ExitCode)"
          Write-Host "Checking output files..."

          Get-ChildItem $work -Force

          if (!(Test-Path $exe)) {
            throw "IExpress failed to create XION_PC_CHECK.exe"
          }

          Write-Host "EXE successfully generated!"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XION-PC-CHECK-EXE
          path: ${{ runner.temp }}/XIONBUILD/XION_PC_CHECK.exe
          if-no-files-found: error
